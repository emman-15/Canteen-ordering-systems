{% extends 'base.html' %}

{% block title %}Register - CMDI Canteen{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 65vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card card-custom p-4 shadow">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3" 
                     style="width: 70px; height: 70px; background-color: rgba(13, 59, 102, 0.1); border: 2px solid var(--cmdi-blue);">
                    <i class="fa-solid fa-user-plus fa-2x" style="color: var(--cmdi-blue);"></i>
                </div>
                <h4 class="fw-bold mb-1" style="color: var(--cmdi-blue);">Gumawa ng Account</h4>
                <span class="badge bg-success mb-2">Libreng ₱100 Wallet Balance</span>
                <p class="text-muted small">CARD-MRI Development Institute, Inc.</p>
            </div>

            <form method="POST" action="{{ url_for('register') }}">
                <div class="mb-3">
                    <label class="form-label fw-semibold small">Buong Pangalan</label>
                    <input type="text" name="name" class="form-control" placeholder="Hal. Juan Dela Cruz" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold small">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Hal. juan2026" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold small">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Gumawa ng password" required>
                </div>

                <button type="submit" class="btn btn-cmdi-blue w-100 py-2 mb-3 shadow-sm">
                    <i class="fa-solid fa-check me-2"></i> Mag-Register Ngayon
                </button>
            </form>

            <div class="text-center">
                <span class="text-muted small">May account ka na? </span>
                <a href="{{ url_for('login') }}" class="fw-bold text-decoration-none" style="color: var(--cmdi-orange);">Bumalik sa Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
