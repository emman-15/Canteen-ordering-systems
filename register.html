{% extends 'base.html' %}
{% block title %}Register Account - Canteen Hub{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="display-5 mb-2">🎉</div>
          <h3 class="fw-bold">Create Student Account</h3>
          <p class="text-muted small">Register to get a free ₱100 welcome balance!</p>
        </div>

        <form method="POST" action="{{ url_for('register') }}">
          <div class="mb-3">
            <label class="form-label fw-semibold">Full Name</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
              <input type="text" name="name" class="form-control" placeholder="e.g. Juan Dela Cruz" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="bi bi-envelope"></i></span>
              <input type="email" name="email" class="form-control" placeholder="juan@university.edu" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Mobile Phone (For Reservation Alerts)</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="bi bi-telephone"></i></span>
              <input type="tel" name="phone" class="form-control" placeholder="0917-000-0000">
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
              <input type="password" name="password" class="form-control" placeholder="Create a secure password" required minlength="4">
            </div>
          </div>

          <button type="submit" class="btn btn-success btn-lg w-100 fw-bold shadow-sm mb-3">
            <i class="bi bi-person-check-fill me-1"></i> Register &amp; Claim ₱100 Balance
          </button>

          <div class="text-center small text-muted">
            Already registered? <a href="{{ url_for('login') }}" class="text-success fw-bold text-decoration-none">Sign In Here</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
