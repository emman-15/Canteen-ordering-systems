{% extends 'base.html' %}

{% block title %}Login - CMDI Canteen{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 65vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card card-custom p-4 shadow">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3" 
                     style="width: 70px; height: 70px; background-color: rgba(255, 114, 0, 0.15); border: 2px solid var(--cmdi-orange);">
                    <i class="fa-solid fa-graduation-cap fa-2x" style="color: var(--cmdi-orange);"></i>
                </div>
                <h4 class="fw-bold mb-1" style="color: var(--cmdi-blue);">CMDI Canteen Login</h4>
                <p class="text-muted small">CARD-MRI Development Institute, Inc.</p>
            </div>

            <form method="POST" action="{{ url_for('login') }}">
                <div class="mb-3">
                    <label class="form-label fw-semibold small">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fa-solid fa-user text-muted"></i></span>
                        <input type="text" name="username" id="username" class="form-control" placeholder="I-type ang username" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold small">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
                        <input type="password" name="password" id="password" class="form-control" placeholder="I-type ang password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-cmdi-orange w-100 py-2 mb-3 shadow-sm">
                    <i class="fa-solid fa-right-to-bracket me-2"></i> Mag-Sign In
                </button>
            </form>

            <div class="text-center mb-3">
                <span class="text-muted small">Bagong estudyante? </span>
                <a href="{{ url_for('register') }}" class="fw-bold text-decoration-none" style="color: var(--cmdi-orange);">Mag-register (Free ₱100)</a>
            </div>

            <div class="border-top pt-3 text-center">
                <p class="text-muted small mb-2 fw-semibold">Quick Login (Subukan):</p>
                <div class="d-flex justify-content-center gap-2">
                    <button type="button" class="btn btn-sm btn-outline-primary" onclick="setCreds('student', 'student123')">
                        <i class="fa-solid fa-user-graduate me-1"></i> Student
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-dark" onclick="setCreds('admin', 'admin123')">
                        <i class="fa-solid fa-user-shield me-1"></i> Admin
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function setCreds(u, p) {
    document.getElementById('username').value = u;
    document.getElementById('password').value = p;
}
</script>
{% endblock %}
