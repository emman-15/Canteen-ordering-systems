{% extends 'base.html' %}
{% block title %}Login - Canteen Hub{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="display-5 mb-2">🍽️</div>
          <h3 class="fw-bold">Sign In to Canteen Hub</h3>
          <p class="text-muted small">Online pre-ordering &amp; table reservations</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
          <div class="mb-3">
            <label class="form-label fw-semibold">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="bi bi-envelope"></i></span>
              <input type="email" name="email" id="loginEmail" class="form-control" placeholder="name@example.com" required>
            </div>
          </div>

          <div class="mb-4">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label class="form-label fw-semibold mb-0">Password</label>
            </div>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
              <input type="password" name="password" id="loginPass" class="form-control" placeholder="••••••••" required>
            </div>
          </div>

          <button type="submit" class="btn btn-success btn-lg w-100 fw-bold shadow-sm mb-3">
            <i class="bi bi-box-arrow-in-right me-1"></i> Log In
          </button>

          <div class="text-center small text-muted">
            Don't have an account? <a href="{{ url_for('register') }}" class="text-success fw-bold text-decoration-none">Create Account</a>
          </div>
        </form>

        <hr class="my-4">

        <!-- Quick Demo Account Fill -->
        <div class="bg-light p-3 rounded-3 small">
          <div class="fw-bold text-muted mb-2 text-uppercase" style="font-size: 0.75rem;">
            <i class="bi bi-key-fill text-warning me-1"></i> Quick Demo Logins (Click to Autofill):
          </div>
          <div class="d-flex gap-2">
            <button type="button" class="btn btn-outline-secondary btn-sm flex-fill" onclick="fillLogin('student@canteen.com', 'student123')">
              <i class="bi bi-person me-1"></i> Student Demo
            </button>
            <button type="button" class="btn btn-outline-dark btn-sm flex-fill" onclick="fillLogin('admin@canteen.com', 'admin123')">
              <i class="bi bi-shield-lock me-1"></i> Admin Demo
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function fillLogin(email, pass) {
  document.getElementById('loginEmail').value = email;
  document.getElementById('loginPass').value = pass;
}
</script>
{% endblock %}
